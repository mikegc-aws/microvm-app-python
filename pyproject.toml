[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microvm-app"
version = "0.1.0"
description = "Zero-dependency Python framework for AWS Lambda MicroVMs: lifecycle hook decorators and a lightweight web server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Mike G Chambers" }]
keywords = ["aws", "lambda", "microvm", "serverless", "firecracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Intentionally empty: the runtime library is stdlib-only so it adds
# nothing to your MicroVM image.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/mikegc-aws/microvm-app-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
